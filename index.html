<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fitness</title>
  <meta name="description" content="Registro personal de comidas, macros, peso, pasos y entrenamiento.">
  <meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <main id="view" aria-live="polite">
      <p class="loading">Cargando…</p>
    </main>
  </div>

  <nav class="tabbar" aria-label="Secciones">
    <button class="tab" data-tab="hoy" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
      <span>Hoy</span>
    </button>
    <button class="tab" data-tab="alimentos" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8a3 3 0 0 0 3 3v7M10 3v6M13 3v8a3 3 0 0 1-3 3M18 21V3c-2 1-3 4-3 8h3"/></svg>
      <span>Alimentos</span>
    </button>
    <button class="tab" data-tab="progreso" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>
      <span>Progreso</span>
    </button>
    <button class="tab" data-tab="ajustes" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <div id="sheet-root" hidden></div>
  <div id="toast" role="status" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
